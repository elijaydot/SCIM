<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Kerberos authentication and delegation flow</title>
  <desc id="desc">A numbered flow separates the client first hop to a web front end from the delegated second hop to SQL, with KDC ticket exchanges shown as separate network paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#173f5f"/>
    </marker>
    <style>
      .box{fill:#f7fbff;stroke:#173f5f;stroke-width:3;rx:14}
      .kdc{fill:#fff4d6;stroke:#8a5a00;stroke-width:3;rx:14}
      .admin{fill:#f4f1fa;stroke:#5b3f8c;stroke-width:2;stroke-dasharray:8 6;rx:12}
      .line{fill:none;stroke:#173f5f;stroke-width:4;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#5b3f8c;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .h{font:700 25px Arial,sans-serif;fill:#102a43}
      .t{font:18px Arial,sans-serif;fill:#102a43}
      .n{font:700 18px Arial,sans-serif;fill:#ffffff}
      .step{fill:#007a78}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="h">Kerberos: first hop, delegated second hop, and configuration</text>

  <rect x="55" y="255" width="225" height="120" class="box"/>
  <text x="168" y="300" text-anchor="middle" class="h">Client / user</text>
  <text x="168" y="332" text-anchor="middle" class="t">Requests the web app</text>
  <text x="168" y="357" text-anchor="middle" class="t">and presents AP-REQ</text>

  <rect x="485" y="255" width="230" height="120" class="box"/>
  <text x="600" y="300" text-anchor="middle" class="h">Front end</text>
  <text x="600" y="332" text-anchor="middle" class="t">Web app impersonates</text>
  <text x="600" y="357" text-anchor="middle" class="t">the authorized user</text>

  <rect x="920" y="255" width="225" height="120" class="box"/>
  <text x="1033" y="300" text-anchor="middle" class="h">Back end</text>
  <text x="1033" y="332" text-anchor="middle" class="t">Example: SQL Server</text>
  <text x="1033" y="357" text-anchor="middle" class="t">checks user context</text>

  <rect x="435" y="70" width="330" height="110" class="kdc"/>
  <text x="600" y="112" text-anchor="middle" class="h">Domain controller / KDC</text>
  <text x="600" y="144" text-anchor="middle" class="t">AS and TGS ticket services</text>

  <path d="M280 285 C345 220 395 170 485 145" class="line"/>
  <circle cx="342" cy="222" r="17" class="step"/><text x="342" y="228" text-anchor="middle" class="n">1</text>
  <text x="272" y="190" class="t">Client obtains ticket</text>

  <path d="M280 330 L485 330" class="line"/>
  <circle cx="382" cy="330" r="17" class="step"/><text x="382" y="336" text-anchor="middle" class="n">2</text>
  <text x="315" y="365" class="t">First hop</text>

  <path d="M650 255 C680 218 700 190 708 180" class="line"/>
  <circle cx="687" cy="212" r="17" class="step"/><text x="687" y="218" text-anchor="middle" class="n">3</text>
  <text x="740" y="215" class="t">Front end requests</text>
  <text x="740" y="238" class="t">delegated service ticket</text>

  <path d="M715 330 L920 330" class="line"/>
  <circle cx="817" cy="330" r="17" class="step"/><text x="817" y="336" text-anchor="middle" class="n">4</text>
  <text x="753" y="365" class="t">Second hop</text>

  <rect x="330" y="480" width="540" height="110" class="admin"/>
  <text x="600" y="520" text-anchor="middle" class="h">Active Directory configuration path</text>
  <text x="600" y="552" text-anchor="middle" class="t">SPNs, delegation settings, sPNMappings, account flags</text>
  <path d="M600 480 L600 375" class="dash"/>
  <text x="620" y="435" class="t">Configuration—not runtime traffic</text>
</svg>
