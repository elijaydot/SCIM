<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AD FS certificate runtime, management, metadata, and diagnostic paths</title>
  <desc id="desc">A four-lane architecture diagram. The runtime lane shows a browser reaching AD FS through optional WAP and carrying a signed federation response to a relying application. Separate lanes show administrator certificate management, relying-party metadata retrieval, and passive diagnostics.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#075985"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#166534"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9a3412"/>
    </marker>
    <style>
      .heading { font: 700 25px Arial, sans-serif; fill: #0f172a; }
      .lane { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .boxTitle { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .text { font: 15px Arial, sans-serif; fill: #1e293b; }
      .small { font: 14px Arial, sans-serif; fill: #334155; }
      .step { font: 700 15px Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="40" y="42" class="heading">AD FS certificate paths: know which traffic you are troubleshooting</text>

  <rect x="30" y="70" width="1140" height="235" rx="14" fill="#e0f2fe" stroke="#075985" stroke-width="2"/>
  <text x="50" y="100" class="lane">Runtime authentication — browser/client-carried messages</text>

  <rect x="65" y="135" width="190" height="100" rx="10" fill="#ffffff" stroke="#075985" stroke-width="2"/>
  <text x="160" y="174" text-anchor="middle" class="boxTitle">Browser or client</text>
  <text x="160" y="202" text-anchor="middle" class="small">Follows redirects</text>

  <rect x="345" y="135" width="190" height="100" rx="10" fill="#ffffff" stroke="#075985" stroke-width="2"/>
  <text x="440" y="174" text-anchor="middle" class="boxTitle">WAP (optional)</text>
  <text x="440" y="202" text-anchor="middle" class="small">Publishes AD FS</text>

  <rect x="625" y="125" width="210" height="120" rx="10" fill="#ffffff" stroke="#075985" stroke-width="2"/>
  <text x="730" y="164" text-anchor="middle" class="boxTitle">AD FS farm</text>
  <text x="730" y="192" text-anchor="middle" class="small">Authenticates and issues</text>
  <text x="730" y="214" text-anchor="middle" class="small">a signed token</text>

  <rect x="925" y="135" width="205" height="100" rx="10" fill="#ffffff" stroke="#075985" stroke-width="2"/>
  <text x="1027" y="174" text-anchor="middle" class="boxTitle">Relying application</text>
  <text x="1027" y="202" text-anchor="middle" class="small">Validates signature</text>

  <line x1="255" y1="160" x2="345" y2="160" stroke="#075985" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <circle cx="294" cy="145" r="13" fill="#075985"/><text x="294" y="150" text-anchor="middle" class="step">1</text>
  <line x1="535" y1="160" x2="625" y2="160" stroke="#075985" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <circle cx="574" cy="145" r="13" fill="#075985"/><text x="574" y="150" text-anchor="middle" class="step">2</text>
  <path d="M730 245 C730 285, 160 285, 160 237" fill="none" stroke="#075985" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <circle cx="460" cy="271" r="13" fill="#075985"/><text x="460" y="276" text-anchor="middle" class="step">3</text>
  <path d="M255 218 C540 285, 760 285, 925 215" fill="none" stroke="#075985" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <circle cx="865" cy="244" r="13" fill="#075985"/><text x="865" y="249" text-anchor="middle" class="step">4</text>

  <rect x="30" y="330" width="1140" height="125" rx="14" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="50" y="360" class="lane">Certificate management — administrative configuration, not a sign-in</text>
  <rect x="85" y="380" width="235" height="52" rx="8" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="202" y="412" text-anchor="middle" class="boxTitle">Administrator / PowerShell</text>
  <rect x="610" y="375" width="275" height="62" rx="8" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="747" y="400" text-anchor="middle" class="boxTitle">AD FS farm</text>
  <text x="747" y="423" text-anchor="middle" class="small">Farm-aware commands may use remoting</text>
  <rect x="960" y="375" width="170" height="62" rx="8" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="1045" y="400" text-anchor="middle" class="boxTitle">WAP nodes</text>
  <text x="1045" y="423" text-anchor="middle" class="small">Update every node</text>
  <line x1="320" y1="396" x2="610" y2="396" stroke="#166534" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowGreen)"/>
  <path d="M320 420 C560 458, 800 458, 960 420" fill="none" stroke="#166534" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowGreen)"/>
  <text x="465" y="388" text-anchor="middle" class="small">Install, bind, set permissions</text>

  <rect x="30" y="480" width="1140" height="115" rx="14" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/>
  <text x="50" y="510" class="lane">Federation metadata — trust synchronization path</text>
  <rect x="105" y="530" width="250" height="45" rx="8" fill="#ffffff" stroke="#9a3412" stroke-width="2"/>
  <text x="230" y="558" text-anchor="middle" class="boxTitle">Relying party / app owner</text>
  <line x1="355" y1="552" x2="625" y2="552" stroke="#9a3412" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="490" y="541" text-anchor="middle" class="small">Retrieves signing certificates</text>
  <rect x="625" y="530" width="240" height="45" rx="8" fill="#ffffff" stroke="#9a3412" stroke-width="2"/>
  <text x="745" y="558" text-anchor="middle" class="boxTitle">AD FS metadata endpoint</text>
  <text x="900" y="559" class="small">Automatic or administrator-triggered</text>

  <rect x="30" y="620" width="1140" height="105" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="50" y="650" class="lane">Diagnostics and monitoring — observe the paths above</text>
  <rect x="90" y="670" width="250" height="35" rx="7" fill="#ffffff" stroke="#475569"/>
  <text x="215" y="693" text-anchor="middle" class="text">Event Viewer and PowerShell</text>
  <rect x="465" y="670" width="250" height="35" rx="7" fill="#ffffff" stroke="#475569"/>
  <text x="590" y="693" text-anchor="middle" class="text">Browser trace or Fiddler</text>
  <rect x="840" y="670" width="250" height="35" rx="7" fill="#ffffff" stroke="#475569"/>
  <text x="965" y="693" text-anchor="middle" class="text">Certificate inspection</text>
</svg>
