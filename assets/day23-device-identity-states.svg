<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Entra device identity states</title>
  <desc id="desc">Comparison of Microsoft Entra registered, Microsoft Entra joined, and Microsoft Entra hybrid joined devices, showing ownership, Windows sign-in identity, management, and resource access.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#0f172a}.head{font:700 21px Arial,sans-serif;fill:#fff}
      .body{font:16px Arial,sans-serif;fill:#0f172a}.small{font:14px Arial,sans-serif;fill:#334155}
      .card{stroke:#334155;stroke-width:2;rx:14}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="46" text-anchor="middle" class="title">Three Microsoft Entra device identity states</text>

  <g transform="translate(40 90)">
    <rect class="card" width="340" height="430" fill="#e0f2fe"/>
    <path d="M0 14 Q0 0 14 0 H326 Q340 0 340 14 V70 H0Z" fill="#0369a1"/>
    <text x="170" y="43" text-anchor="middle" class="head">Entra registered</text>
    <text x="24" y="105" class="body"><tspan font-weight="700">Typical device:</tspan><tspan x="24" dy="25">Personal / BYOD</tspan></text>
    <text x="24" y="170" class="body"><tspan font-weight="700">Windows sign-in:</tspan><tspan x="24" dy="25">Local or personal account</tspan></text>
    <text x="24" y="235" class="body"><tspan font-weight="700">Identity:</tspan><tspan x="24" dy="25">Entra registration only</tspan></text>
    <text x="24" y="300" class="body"><tspan font-weight="700">Management:</tspan><tspan x="24" dy="25">Optional Intune enrollment</tspan></text>
    <text x="24" y="365" class="body"><tspan font-weight="700">Best fit:</tspan><tspan x="24" dy="25">Recognized device for</tspan><tspan x="24" dy="22">work-resource access</tspan></text>
  </g>

  <g transform="translate(430 90)">
    <rect class="card" width="340" height="430" fill="#dcfce7"/>
    <path d="M0 14 Q0 0 14 0 H326 Q340 0 340 14 V70 H0Z" fill="#15803d"/>
    <text x="170" y="43" text-anchor="middle" class="head">Entra joined</text>
    <text x="24" y="105" class="body"><tspan font-weight="700">Typical device:</tspan><tspan x="24" dy="25">Corporate, cloud-first</tspan></text>
    <text x="24" y="170" class="body"><tspan font-weight="700">Windows sign-in:</tspan><tspan x="24" dy="25">Entra account</tspan></text>
    <text x="24" y="235" class="body"><tspan font-weight="700">Identity:</tspan><tspan x="24" dy="25">Joined directly to Entra ID</tspan></text>
    <text x="24" y="300" class="body"><tspan font-weight="700">Management:</tspan><tspan x="24" dy="25">Usually Intune</tspan></text>
    <text x="24" y="365" class="body"><tspan font-weight="700">Best fit:</tspan><tspan x="24" dy="25">Cloud-first organizations</tspan><tspan x="24" dy="22">without an AD join</tspan></text>
  </g>

  <g transform="translate(820 90)">
    <rect class="card" width="340" height="430" fill="#fef3c7"/>
    <path d="M0 14 Q0 0 14 0 H326 Q340 0 340 14 V70 H0Z" fill="#a16207"/>
    <text x="170" y="43" text-anchor="middle" class="head">Hybrid joined</text>
    <text x="24" y="105" class="body"><tspan font-weight="700">Typical device:</tspan><tspan x="24" dy="25">Corporate, domain joined</tspan></text>
    <text x="24" y="170" class="body"><tspan font-weight="700">Windows sign-in:</tspan><tspan x="24" dy="25">AD domain account</tspan></text>
    <text x="24" y="235" class="body"><tspan font-weight="700">Identity:</tspan><tspan x="24" dy="25">AD join plus Entra</tspan><tspan x="24" dy="22">hybrid device identity</tspan></text>
    <text x="24" y="300" class="body"><tspan font-weight="700">Management:</tspan><tspan x="24" dy="25">GPO and/or Intune</tspan></text>
    <text x="24" y="365" class="body"><tspan font-weight="700">Best fit:</tspan><tspan x="24" dy="25">AD-dependent organization</tspan><tspan x="24" dy="22">moving toward cloud services</tspan></text>
  </g>

  <text x="600" y="607" text-anchor="middle" class="small">Registration, join, and hybrid join are distinct states—not interchangeable labels.</text>
</svg>
