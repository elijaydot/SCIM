<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">Choosing a Windows service identity without Active Directory</title>
  <desc id="desc">A decision flow recommends a virtual account when supported, an appropriate built-in account when its privilege model fits, or a dedicated local user when an ordinary username and password is required. Active Directory managed service accounts are unavailable on a standalone computer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457a6"/>
    </marker>
    <style>
      .title{font:700 29px Arial,sans-serif;fill:#172033;text-anchor:middle}
      .heading{font:700 19px Arial,sans-serif;fill:#172033;text-anchor:middle}
      .body{font:15px Arial,sans-serif;fill:#33415c;text-anchor:middle}
      .question{fill:#fff8e6;stroke:#b7791f;stroke-width:3;rx:14}
      .choice{fill:#f7faff;stroke:#2457a6;stroke-width:3;rx:14}
      .recommended{fill:#eef9f1;stroke:#247a42;stroke-width:3;rx:14}
      .unavailable{fill:#fdeaea;stroke:#a12622;stroke-width:3;rx:14}
      .line{fill:none;stroke:#2457a6;stroke-width:3;marker-end:url(#arrow)}
      .label{font:700 15px Arial,sans-serif;fill:#2457a6;text-anchor:middle}
      .note{font:14px Arial,sans-serif;fill:#5c3b0b;text-anchor:middle}
    </style>
  </defs>

  <rect width="1300" height="760" fill="#ffffff"/>
  <text x="650" y="45" class="title">Choose a Service Identity on Standalone Windows</text>

  <rect x="470" y="80" width="360" height="95" class="question"/>
  <text x="650" y="118" class="heading">Does the service support a virtual account?</text>
  <text x="650" y="147" class="body">Example: NT SERVICE\MyService</text>

  <rect x="90" y="250" width="340" height="120" class="recommended"/>
  <text x="260" y="290" class="heading">Use a virtual account</text>
  <text x="260" y="320" class="body">No password to manage</text>
  <text x="260" y="346" class="body">Grant only required local permissions</text>

  <rect x="480" y="250" width="340" height="120" class="question"/>
  <text x="650" y="287" class="heading">Does a built-in account's</text>
  <text x="650" y="313" class="heading">privilege model fit?</text>
  <text x="650" y="343" class="body">LocalService, NetworkService, or LocalSystem</text>

  <rect x="870" y="250" width="340" height="120" class="choice"/>
  <text x="1040" y="290" class="heading">Use a suitable built-in account</text>
  <text x="1040" y="320" class="body">Document its local privileges</text>
  <text x="1040" y="346" class="body">and network behavior</text>

  <rect x="480" y="455" width="340" height="120" class="choice"/>
  <text x="650" y="495" class="heading">Use a dedicated local user</text>
  <text x="650" y="525" class="body">When an ordinary username</text>
  <text x="650" y="551" class="body">and password are required</text>

  <rect x="90" y="625" width="1120" height="95" class="unavailable"/>
  <text x="650" y="663" class="heading">sMSA, gMSA, and dMSA require Active Directory</text>
  <text x="650" y="692" class="body">They are not local-only service identities for a standalone or workgroup computer.</text>

  <path d="M570 175 C500 210 380 220 300 250" class="line"/>
  <text x="430" y="215" class="label">Yes</text>

  <path d="M650 175 V250" class="line"/>
  <text x="675" y="215" class="label">No</text>

  <path d="M820 310 H870" class="line"/>
  <text x="845" y="295" class="label">Yes</text>

  <path d="M650 370 V455" class="line"/>
  <text x="675" y="415" class="label">No</text>

  <path d="M650 575 V625" class="line"/>
  <text x="650" y="607" class="note">Need an AD-managed service identity? The machine and environment must meet AD requirements.</text>
</svg>
