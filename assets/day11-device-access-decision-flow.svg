<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Entra access decision flow</title>
  <desc id="desc">Conditional Access evaluates the user, device, authentication method, and policy requirements before allowing or blocking access.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#eff6ff;stroke:#2563eb;stroke-width:3}
      .policy{fill:#faf5ff;stroke:#7e22ce;stroke-width:3}
      .allow{fill:#ecfdf5;stroke:#047857;stroke-width:3}
      .block{fill:#fef2f2;stroke:#b91c1c;stroke-width:3}
      .line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .title{font:700 27px Arial,sans-serif;fill:#0f172a}
      .label{font:700 19px Arial,sans-serif;fill:#0f172a}
      .text{font:15px Arial,sans-serif;fill:#334155}
      .small{font:14px Arial,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="1100" height="420" fill="white"/>
  <text x="550" y="42" text-anchor="middle" class="title">Conditional Access Decision Inputs</text>
  <rect x="35" y="100" width="180" height="110" rx="15" class="box"/>
  <text x="125" y="137" text-anchor="middle" class="label">User</text>
  <text x="125" y="166" text-anchor="middle" class="text">Who is signing in?</text>
  <text x="125" y="190" text-anchor="middle" class="small">Example: Rachel</text>
  <path d="M215 155 H250" class="line"/>
  <rect x="250" y="100" width="180" height="110" rx="15" class="box"/>
  <text x="340" y="137" text-anchor="middle" class="label">Device</text>
  <text x="340" y="166" text-anchor="middle" class="text">Which endpoint?</text>
  <text x="340" y="190" text-anchor="middle" class="small">Example: Laptop-01</text>
  <path d="M430 155 H465" class="line"/>
  <rect x="465" y="100" width="180" height="110" rx="15" class="box"/>
  <text x="555" y="137" text-anchor="middle" class="label">Authentication</text>
  <text x="555" y="166" text-anchor="middle" class="text">How verified?</text>
  <text x="555" y="190" text-anchor="middle" class="small">Password, MFA, passkey</text>
  <path d="M645 155 H680" class="line"/>
  <rect x="680" y="100" width="180" height="110" rx="15" class="policy"/>
  <text x="770" y="137" text-anchor="middle" class="label">Policy</text>
  <text x="770" y="166" text-anchor="middle" class="text">What is required?</text>
  <text x="770" y="190" text-anchor="middle" class="small">Join and compliance rules</text>
  <path d="M860 155 H900" class="line"/>
  <rect x="900" y="80" width="165" height="75" rx="15" class="allow"/>
  <text x="982" y="126" text-anchor="middle" class="label">Allow access</text>
  <rect x="900" y="190" width="165" height="75" rx="15" class="block"/>
  <text x="982" y="236" text-anchor="middle" class="label">Block access</text>
  <path d="M880 155 C900 155 880 228 900 228" class="line"/>
  <text x="550" y="320" text-anchor="middle" class="label">Joined does not automatically mean managed or compliant.</text>
  <text x="550" y="352" text-anchor="middle" class="text">Identity, management, and compliance are separate states that policy can evaluate.</text>
  <text x="550" y="392" text-anchor="middle" class="small">User + device + authentication + policy requirements → access decision</text>
</svg>
