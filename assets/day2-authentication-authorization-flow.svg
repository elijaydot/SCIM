<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250" role="img" aria-labelledby="title desc">
  <title id="title">Authentication and authorization flow</title>
  <desc id="desc">An identity presents credentials, authentication verifies the identity, authorization checks permissions, and access is either allowed or denied.</desc>
  <defs>
    <style>.box{fill:#f8fafc;stroke:#0f766e;stroke-width:2}.head{fill:#ccfbf1}.t{font:600 17px Arial,sans-serif;fill:#134e4a}.s{font:14px Arial,sans-serif;fill:#334155}.a{stroke:#64748b;stroke-width:2.5;fill:none}</style>
    <marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#64748b"/></marker>
  </defs>
  <rect class="box" x="25" y="70" rx="12" width="175" height="95"/><text class="t" x="112" y="106" text-anchor="middle">Identity</text><text class="s" x="112" y="134" text-anchor="middle">Credentials / factor</text>
  <path class="a" marker-end="url(#m)" d="M200 117H245"/>
  <rect class="box head" x="245" y="70" rx="12" width="205" height="95"/><text class="t" x="347" y="106" text-anchor="middle">Authentication</text><text class="s" x="347" y="134" text-anchor="middle">Who are you?</text>
  <path class="a" marker-end="url(#m)" d="M450 117H495"/>
  <rect class="box head" x="495" y="70" rx="12" width="205" height="95"/><text class="t" x="597" y="106" text-anchor="middle">Authorization</text><text class="s" x="597" y="134" text-anchor="middle">What may you do?</text>
  <path class="a" marker-end="url(#m)" d="M700 117H745"/>
  <rect class="box" x="745" y="45" rx="12" width="205" height="65"/><text class="t" x="847" y="84" text-anchor="middle">Allow resource access</text>
  <rect class="box" x="745" y="140" rx="12" width="205" height="65"/><text class="t" x="847" y="179" text-anchor="middle">Deny access</text>
  <path class="a" marker-end="url(#m)" d="M700 117C725 117 720 77 745 77"/>
  <path class="a" marker-end="url(#m)" d="M700 117C725 117 720 172 745 172"/>
</svg>
