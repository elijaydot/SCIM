<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid authentication paths for PHS and PTA</title>
  <desc id="desc">A user signs in to Microsoft Entra ID. Password Hash Synchronization validates in the cloud, while Pass-Through Authentication sends validation through an on-premises agent to a domain controller.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#2563eb;stroke-width:3;rx:14}
      .cloud{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3}
      .onprem{fill:#fff7ed;stroke:#c2410c;stroke-width:3}
      .line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}
      .title{font:700 26px Arial,sans-serif;fill:#0f172a}
      .label{font:700 20px Arial,sans-serif;fill:#0f172a}
      .text{font:16px Arial,sans-serif;fill:#334155}
      .small{font:14px Arial,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="1000" height="560" fill="white"/>
  <text x="500" y="42" text-anchor="middle" class="title">PHS and PTA Authentication Paths</text>
  <rect x="400" y="72" width="200" height="70" class="box"/>
  <text x="500" y="114" text-anchor="middle" class="label">User sign-in</text>
  <path d="M500 142 V190" class="line"/>
  <rect x="350" y="190" width="300" height="85" class="cloud" rx="16"/>
  <text x="500" y="226" text-anchor="middle" class="label">Microsoft Entra ID</text>
  <text x="500" y="250" text-anchor="middle" class="text">Receives the sign-in request</text>
  <line x1="500" y1="275" x2="500" y2="320" class="dash"/>
  <text x="245" y="314" text-anchor="middle" class="label">PHS</text>
  <text x="755" y="314" text-anchor="middle" class="label">PTA</text>
  <path d="M430 275 C430 310 245 300 245 350" class="line"/>
  <path d="M570 275 C570 310 755 300 755 350" class="line"/>
  <rect x="95" y="350" width="300" height="105" class="cloud" rx="16"/>
  <text x="245" y="390" text-anchor="middle" class="label">Cloud validation</text>
  <text x="245" y="417" text-anchor="middle" class="text">Uses the synchronized hash</text>
  <text x="245" y="440" text-anchor="middle" class="small">No on-premises lookup during sign-in</text>
  <rect x="605" y="350" width="300" height="85" class="onprem" rx="16"/>
  <text x="755" y="385" text-anchor="middle" class="label">PTA agent</text>
  <text x="755" y="411" text-anchor="middle" class="text">Runs on-premises</text>
  <path d="M755 435 V470" class="line"/>
  <rect x="605" y="470" width="300" height="65" class="onprem" rx="16"/>
  <text x="755" y="510" text-anchor="middle" class="label">Domain controller</text>
  <text x="38" y="530" class="small">Blue = cloud</text>
  <text x="38" y="550" class="small">Orange = on-premises</text>
</svg>
