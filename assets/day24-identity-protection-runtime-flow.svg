<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Entra ID Protection runtime sign-in flow</title>
  <desc id="desc">A seven-step flow shows a browser or client requesting an application, authenticating with Microsoft Entra ID, undergoing user and sign-in risk analysis and Conditional Access evaluation, then receiving an allow, stronger authentication, remediation, or block decision.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#123B5D"/>
    </marker>
    <style>
      .box { fill: #F7FAFC; stroke: #123B5D; stroke-width: 3; rx: 14; }
      .accent { fill: #E2F1FB; stroke: #075985; stroke-width: 3; rx: 14; }
      .decision { fill: #FFF4CC; stroke: #7A4E00; stroke-width: 3; rx: 14; }
      .allow { fill: #E4F7E8; stroke: #176B2C; stroke-width: 3; rx: 14; }
      .deny { fill: #FDE8E8; stroke: #9B1C1C; stroke-width: 3; rx: 14; }
      .line { stroke: #123B5D; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .title { font: 700 28px Arial, sans-serif; fill: #102A43; }
      .label { font: 700 20px Arial, sans-serif; fill: #102A43; }
      .text { font: 16px Arial, sans-serif; fill: #243B53; }
      .step { fill: #123B5D; }
      .stepText { font: 700 17px Arial, sans-serif; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <text x="600" y="42" text-anchor="middle" class="title">Runtime Risk Evaluation and Conditional Access</text>

  <rect x="50" y="90" width="220" height="110" class="box"/>
  <circle cx="75" cy="115" r="18" class="step"/><text x="75" y="115" class="stepText">1</text>
  <text x="160" y="130" text-anchor="middle" class="label">Browser or client</text>
  <text x="160" y="160" text-anchor="middle" class="text">Requests an application</text>

  <rect x="350" y="90" width="250" height="110" class="accent"/>
  <circle cx="375" cy="115" r="18" class="step"/><text x="375" y="115" class="stepText">2</text>
  <text x="475" y="130" text-anchor="middle" class="label">Microsoft Entra ID</text>
  <text x="475" y="160" text-anchor="middle" class="text">Performs authentication</text>

  <rect x="680" y="75" width="460" height="140" class="accent"/>
  <circle cx="705" cy="100" r="18" class="step"/><text x="705" y="100" class="stepText">3</text>
  <text x="910" y="112" text-anchor="middle" class="label">Identity Protection analysis</text>
  <text x="795" y="155" text-anchor="middle" class="text">User risk</text>
  <text x="1020" y="155" text-anchor="middle" class="text">Sign-in risk</text>
  <text x="910" y="188" text-anchor="middle" class="text">Real-time and offline signals</text>

  <path d="M270 145 H350" class="line"/>
  <path d="M600 145 H680" class="line"/>

  <rect x="440" y="285" width="320" height="120" class="decision"/>
  <circle cx="465" cy="310" r="18" class="step"/><text x="465" y="310" class="stepText">4</text>
  <text x="600" y="330" text-anchor="middle" class="label">Conditional Access</text>
  <text x="600" y="360" text-anchor="middle" class="text">Evaluates risk, assignments,</text>
  <text x="600" y="384" text-anchor="middle" class="text">conditions, and controls</text>
  <path d="M910 215 V250 H600 V285" class="line"/>

  <rect x="45" y="500" width="230" height="100" class="allow"/>
  <circle cx="70" cy="525" r="18" class="step"/><text x="70" y="525" class="stepText">5A</text>
  <text x="160" y="542" text-anchor="middle" class="label">Allow</text>
  <text x="160" y="572" text-anchor="middle" class="text">Continue token issuance</text>

  <rect x="330" y="500" width="250" height="100" class="decision"/>
  <circle cx="355" cy="525" r="18" class="step"/><text x="355" y="525" class="stepText">5B</text>
  <text x="455" y="542" text-anchor="middle" class="label">Require strength</text>
  <text x="455" y="572" text-anchor="middle" class="text">MFA or approved method</text>

  <rect x="635" y="500" width="250" height="100" class="decision"/>
  <circle cx="660" cy="525" r="18" class="step"/><text x="660" y="525" class="stepText">5C</text>
  <text x="760" y="542" text-anchor="middle" class="label">Remediate</text>
  <text x="760" y="572" text-anchor="middle" class="text">Secure password change</text>

  <rect x="940" y="500" width="215" height="100" class="deny"/>
  <circle cx="965" cy="525" r="18" class="step"/><text x="965" y="525" class="stepText">5D</text>
  <text x="1048" y="542" text-anchor="middle" class="label">Block</text>
  <text x="1048" y="572" text-anchor="middle" class="text">Deny access</text>

  <path d="M600 405 V450 H160 V500" class="line"/>
  <path d="M600 405 V450 H455 V500" class="line"/>
  <path d="M600 405 V450 H760 V500" class="line"/>
  <path d="M600 405 V450 H1048 V500" class="line"/>
</svg>
