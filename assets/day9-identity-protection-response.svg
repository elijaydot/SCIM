<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Entra ID Protection risk response</title>
  <desc id="desc">Signals such as IP address, geolocation, devices, and user behavior feed risk detection. Reports support investigation, and Conditional Access or administrators respond to the risk.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/></marker>
  <style>.b{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:14}.h{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#2e1065;text-anchor:middle}.t{font:14px 'Segoe UI',Arial,sans-serif;fill:#5b21b6;text-anchor:middle}.l{stroke:#7c3aed;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="960" height="330" fill="#fafafa"/>
  <text x="480" y="40" class="h" style="font-size:26px">Microsoft Entra ID Protection: detect, investigate, respond</text>
  <rect x="30" y="90" width="200" height="170" class="b"/><text x="130" y="126" class="h">Signals</text><text x="130" y="158" class="t">IP address</text><text x="130" y="183" class="t">Geolocation</text><text x="130" y="208" class="t">Device</text><text x="130" y="233" class="t">User and sign-in patterns</text>
  <rect x="280" y="110" width="190" height="130" class="b"/><text x="375" y="148" class="h">Detect risk</text><text x="375" y="180" class="t">Risky users, sign-ins,</text><text x="375" y="204" class="t">workloads, and detections</text>
  <rect x="520" y="110" width="190" height="130" class="b"/><text x="615" y="148" class="h">Investigate</text><text x="615" y="180" class="t">Review reports and</text><text x="615" y="204" class="t">understand the event</text>
  <rect x="760" y="110" width="170" height="130" class="b"/><text x="845" y="148" class="h">Respond</text><text x="845" y="180" class="t">Remediate or apply</text><text x="845" y="204" class="t">Conditional Access</text>
  <line x1="230" y1="175" x2="278" y2="175" class="l"/><line x1="470" y1="175" x2="518" y2="175" class="l"/><line x1="710" y1="175" x2="758" y2="175" class="l"/>
</svg>
