<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Kerberos constrained delegation ticket flow through Web Application Proxy</title>
  <desc id="desc">A numbered flow showing a user authenticating through Web Application Proxy, WAP requesting a delegated service ticket from the KDC, and the backend service decrypting it only when the SPN owner matches the service account.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="returnArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#166534"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#111827}.label{font:700 18px Arial,sans-serif;fill:#111827}
      .text{font:16px Arial,sans-serif;fill:#111827}.small{font:14px Arial,sans-serif;fill:#111827}
      .box{stroke:#111827;stroke-width:2}.client{fill:#e0f2fe}.proxy{fill:#ede9fe}.directory{fill:#ffedd5}.app{fill:#dcfce7}
      .flow{fill:none;stroke:#1d4ed8;stroke-width:4;marker-end:url(#arrow)}
      .return{fill:none;stroke:#166534;stroke-width:4;marker-end:url(#returnArrow)}
    </style>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">WAP + KCD: Identity, SPN, and Ticket Must Align</text>

  <rect x="45" y="125" width="200" height="105" rx="12" class="box client"/>
  <text x="145" y="165" text-anchor="middle" class="label">User / Browser</text>
  <text x="145" y="193" text-anchor="middle" class="small">Original user identity</text>

  <rect x="335" y="125" width="200" height="105" rx="12" class="box proxy"/>
  <text x="435" y="165" text-anchor="middle" class="label">WAP Server</text>
  <text x="435" y="193" text-anchor="middle" class="small">Delegating computer</text>
  <text x="435" y="213" text-anchor="middle" class="small">account</text>

  <rect x="665" y="125" width="200" height="105" rx="12" class="box directory"/>
  <text x="765" y="165" text-anchor="middle" class="label">AD DS / KDC</text>
  <text x="765" y="193" text-anchor="middle" class="small">Looks up SPN owner and</text>
  <text x="765" y="213" text-anchor="middle" class="small">issues service ticket</text>

  <rect x="955" y="125" width="200" height="105" rx="12" class="box app"/>
  <text x="1055" y="165" text-anchor="middle" class="label">Backend IIS App</text>
  <text x="1055" y="193" text-anchor="middle" class="small">App pool service account</text>

  <path d="M245 177 H335" class="flow"/>
  <text x="290" y="158" text-anchor="middle" class="small">1. Authenticate</text>
  <path d="M535 160 H665" class="flow"/>
  <text x="600" y="140" text-anchor="middle" class="small">2. Request ticket for</text>
  <text x="600" y="157" text-anchor="middle" class="small">HTTP/app.contoso.com</text>
  <path d="M665 205 H535" class="return"/>
  <text x="600" y="228" text-anchor="middle" class="small">3. Delegated service ticket</text>
  <path d="M535 260 C690 340 860 340 955 210" class="flow"/>
  <text x="750" y="330" text-anchor="middle" class="small">4. WAP presents ticket on the user's behalf</text>

  <rect x="180" y="400" width="840" height="125" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="600" y="435" text-anchor="middle" class="label">Required alignment</text>
  <text x="600" y="466" text-anchor="middle" class="text">WAP delegation target = HTTP/app.contoso.com</text>
  <text x="600" y="494" text-anchor="middle" class="text">SPN owner = account running the IIS application pool</text>
  <text x="600" y="518" text-anchor="middle" class="small">Mismatch → the service cannot decrypt the ticket → KRB_AP_ERR_MODIFIED</text>
</svg>
