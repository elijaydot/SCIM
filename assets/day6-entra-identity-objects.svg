<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Entra ID identity objects and access flow</title>
  <desc id="desc">A central Entra ID directory connects users, groups, devices, applications, service principals, and managed identities to authentication, authorization, and protected resources.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .box{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:12}
      .core{fill:#1d4ed8;stroke:#1e3a8a;stroke-width:2;rx:16}
      .label{font:600 18px 'Segoe UI',Arial,sans-serif;fill:#172554;text-anchor:middle}
      .small{font:15px 'Segoe UI',Arial,sans-serif;fill:#334155;text-anchor:middle}
      .white{fill:#fff}
      .line{stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="520" fill="#f8fafc"/>
  <text x="480" y="38" class="label" style="font-size:26px">Microsoft Entra ID: identities, checks, and access</text>
  <rect x="355" y="195" width="250" height="115" class="core"/>
  <text x="480" y="238" class="label white">Microsoft Entra ID</text>
  <text x="480" y="266" class="small white">Directory and identity provider</text>
  <text x="480" y="291" class="small white">Authentication + authorization</text>
  <rect x="40" y="85" width="190" height="80" class="box"/>
  <text x="135" y="120" class="label">Users &amp; groups</text>
  <text x="135" y="145" class="small">People and collections</text>
  <rect x="40" y="350" width="190" height="80" class="box"/>
  <text x="135" y="385" class="label">Devices</text>
  <text x="135" y="410" class="small">Registered or joined</text>
  <rect x="730" y="85" width="190" height="80" class="box"/>
  <text x="825" y="120" class="label">Applications</text>
  <text x="825" y="145" class="small">App registrations</text>
  <rect x="730" y="350" width="190" height="80" class="box"/>
  <text x="825" y="377" class="label">Workload identities</text>
  <text x="825" y="402" class="small">Service principals and</text>
  <text x="825" y="422" class="small">managed identities</text>
  <rect x="355" y="420" width="250" height="70" class="box"/>
  <text x="480" y="450" class="label">Protected resources</text>
  <text x="480" y="474" class="small">Microsoft 365, Azure, APIs, apps</text>
  <line x1="230" y1="135" x2="354" y2="218" class="line"/>
  <line x1="230" y1="390" x2="354" y2="287" class="line"/>
  <line x1="730" y1="135" x2="606" y2="218" class="line"/>
  <line x1="730" y1="390" x2="606" y2="287" class="line"/>
  <line x1="480" y1="310" x2="480" y2="418" class="line"/>
</svg>
