<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">AD FS Azure MFA adapter architecture and traffic paths</title>
  <desc id="desc">A high-contrast architecture diagram separating browser-carried federation, AD FS server-to-cloud calls, user verification, configuration, and monitoring paths.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#075a9c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#08783e"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a34a00"/>
    </marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#17212b}.subtitle{font:16px Arial,sans-serif;fill:#34495e}
      .box{fill:#fff;stroke:#17212b;stroke-width:2}.boxTitle{font:700 20px Arial,sans-serif;fill:#17212b}
      .body{font:15px Arial,sans-serif;fill:#17212b}.small{font:14px Arial,sans-serif;fill:#17212b}
      .blue{stroke:#075a9c;stroke-width:4;fill:none;marker-end:url(#arrowBlue)}
      .green{stroke:#08783e;stroke-width:4;fill:none;marker-end:url(#arrowGreen)}
      .orange{stroke:#a34a00;stroke-width:4;fill:none;marker-end:url(#arrowOrange)}
      .dash{stroke:#5f6b76;stroke-width:3;stroke-dasharray:9 7;fill:none}
      .step{fill:#17212b}.stepText{font:700 14px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f4f7fa"/>
  <text x="60" y="52" class="title">Azure MFA Adapter: Keep the Traffic Paths Separate</text>
  <text x="60" y="80" class="subtitle">Solid lines are runtime authentication; dashed lines are configuration or monitoring.</text>

  <rect x="55" y="140" width="205" height="130" rx="12" class="box"/>
  <text x="157" y="174" text-anchor="middle" class="boxTitle">User Browser</text>
  <text x="75" y="208" class="body">• Carries redirects</text>
  <text x="75" y="234" class="body">• Posts forms and codes</text>

  <rect x="360" y="140" width="220" height="130" rx="12" class="box"/>
  <text x="470" y="174" text-anchor="middle" class="boxTitle">Web Application</text>
  <text x="380" y="208" class="body">• Relying party</text>
  <text x="380" y="234" class="body">• Validates token</text>

  <rect x="360" y="365" width="220" height="155" rx="12" class="box"/>
  <text x="470" y="400" text-anchor="middle" class="boxTitle">AD FS + Adapter</text>
  <text x="380" y="434" class="body">• Primary authentication</text>
  <text x="380" y="460" class="body">• MFA orchestration</text>
  <text x="380" y="486" class="body">• Token issuance</text>

  <rect x="700" y="140" width="220" height="130" rx="12" class="box"/>
  <text x="810" y="174" text-anchor="middle" class="boxTitle">Microsoft Entra ID</text>
  <text x="720" y="208" class="body">• Client-certificate auth</text>
  <text x="720" y="234" class="body">• Returns access token</text>

  <rect x="700" y="365" width="220" height="155" rx="12" class="box"/>
  <text x="810" y="400" text-anchor="middle" class="boxTitle">Azure MFA API</text>
  <text x="720" y="434" class="body">• Available methods</text>
  <text x="720" y="460" class="body">• Begin authentication</text>
  <text x="720" y="486" class="body">• Check completion</text>

  <rect x="1000" y="365" width="155" height="155" rx="12" class="box"/>
  <text x="1077" y="400" text-anchor="middle" class="boxTitle">User Device</text>
  <text x="1020" y="434" class="body">Call</text>
  <text x="1020" y="460" class="body">SMS / OTP</text>
  <text x="1020" y="486" class="body">Push</text>

  <path d="M260 180 L360 180" class="blue"/>
  <path d="M360 232 L260 232" class="blue"/>
  <circle cx="310" cy="165" r="13" class="step"/><text x="310" y="165" class="stepText">1</text>
  <text x="270" y="285" class="small">Browser request + application redirect</text>

  <path d="M205 270 C220 390 265 440 360 440" class="blue"/>
  <path d="M360 480 C270 500 220 420 190 270" class="blue"/>
  <circle cx="274" cy="384" r="13" class="step"/><text x="274" y="384" class="stepText">2</text>
  <text x="70" y="545" class="small">Browser carries credentials, hidden</text>
  <text x="70" y="566" class="small">forms, token response, and redirects</text>

  <path d="M580 405 C620 330 655 240 700 215" class="green"/>
  <circle cx="632" cy="312" r="13" class="step"/><text x="632" y="312" class="stepText">3</text>
  <text x="595" y="290" class="small">OAuth client credentials</text>

  <path d="M580 455 L700 455" class="green"/>
  <path d="M700 490 L580 490" class="green"/>
  <circle cx="640" cy="440" r="13" class="step"/><text x="640" y="440" class="stepText">4</text>
  <text x="600" y="535" class="small">Server-to-server API calls</text>

  <path d="M920 440 L1000 440" class="orange"/>
  <path d="M1000 485 L920 485" class="orange"/>
  <circle cx="960" cy="425" r="13" class="step"/><text x="960" y="425" class="stepText">5</text>
  <text x="940" y="550" class="small">Verification channel</text>

  <rect x="55" y="610" width="1100" height="60" rx="10" fill="#fff" stroke="#5f6b76" stroke-width="2"/>
  <path d="M90 635 L175 635" class="dash"/>
  <text x="195" y="641" class="small">Management/monitoring: adapter registration, configuration database, certificate upload, logs, traces, and health checks</text>
</svg>
