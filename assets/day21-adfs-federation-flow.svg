<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">External AD FS browser authentication sequence</title>
  <desc id="desc">A browser first visits the application, follows a redirect through Web Application Proxy to AD FS, AD FS validates the user with Active Directory, and the browser returns the signed token to the application.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457a6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#247a42"/>
    </marker>
    <style>
      .actor { fill: #f7faff; stroke: #2457a6; stroke-width: 3; rx: 12; }
      .identity { fill: #eef9f1; stroke: #247a42; stroke-width: 3; rx: 12; }
      .actorText { fill: #172033; font: 700 21px Arial, sans-serif; text-anchor: middle; }
      .subText { fill: #33415c; font: 15px Arial, sans-serif; text-anchor: middle; }
      .life { stroke: #8794aa; stroke-width: 2; stroke-dasharray: 8 7; }
      .request { fill: none; stroke: #2457a6; stroke-width: 3; marker-end: url(#arrowBlue); }
      .response { fill: none; stroke: #247a42; stroke-width: 3; marker-end: url(#arrowGreen); }
      .label { fill: #172033; font: 16px Arial, sans-serif; text-anchor: middle; }
      .step { fill: #2457a6; font: 700 16px Arial, sans-serif; }
      .note { fill: #fff8e6; stroke: #b7791f; stroke-width: 2; rx: 10; }
      .noteText { fill: #5c3b0b; font: 16px Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1400" height="930" fill="#ffffff"/>

  <rect class="actor" x="45" y="35" width="210" height="78"/>
  <text class="actorText" x="150" y="68">User's browser</text>
  <text class="subText" x="150" y="94">Carries redirects and tokens</text>

  <rect class="actor" x="315" y="35" width="210" height="78"/>
  <text class="actorText" x="420" y="68">Application</text>
  <text class="subText" x="420" y="94">Relying party / SP</text>

  <rect class="actor" x="585" y="35" width="210" height="78"/>
  <text class="actorText" x="690" y="68">WAP</text>
  <text class="subText" x="690" y="94">External AD FS proxy</text>

  <rect class="identity" x="855" y="35" width="210" height="78"/>
  <text class="actorText" x="960" y="68">AD FS</text>
  <text class="subText" x="960" y="94">Federation service</text>

  <rect class="identity" x="1125" y="35" width="230" height="78"/>
  <text class="actorText" x="1240" y="68">Active Directory</text>
  <text class="subText" x="1240" y="94">Identity source</text>

  <line class="life" x1="150" y1="113" x2="150" y2="850"/>
  <line class="life" x1="420" y1="113" x2="420" y2="850"/>
  <line class="life" x1="690" y1="113" x2="690" y2="850"/>
  <line class="life" x1="960" y1="113" x2="960" y2="850"/>
  <line class="life" x1="1240" y1="113" x2="1240" y2="850"/>

  <text class="step" x="30" y="165">1</text>
  <path class="request" d="M150 160 H420"/>
  <text class="label" x="285" y="150">Request protected application</text>

  <text class="step" x="30" y="245">2</text>
  <path class="response" d="M420 240 H150"/>
  <text class="label" x="285" y="230">Redirect to the AD FS sign-in URL</text>

  <text class="step" x="30" y="325">3</text>
  <path class="request" d="M150 320 H690"/>
  <text class="label" x="420" y="310">Browser follows the external federation URL</text>

  <text class="step" x="30" y="405">4</text>
  <path class="request" d="M690 400 H960"/>
  <text class="label" x="825" y="390">WAP proxies the request to AD FS</text>

  <text class="step" x="30" y="485">5</text>
  <path class="request" d="M960 480 H1240"/>
  <text class="label" x="1100" y="470">Validate identity and retrieve attributes</text>
  <path class="response" d="M1240 520 H960"/>
  <text class="label" x="1100" y="550">Authentication result</text>

  <text class="step" x="30" y="625">6</text>
  <path class="response" d="M960 620 H690"/>
  <text class="label" x="825" y="610">Signed token response</text>

  <text class="step" x="30" y="705">7</text>
  <path class="response" d="M690 700 H150"/>
  <text class="label" x="420" y="690">WAP returns the AD FS response to the browser</text>

  <text class="step" x="30" y="785">8</text>
  <path class="request" d="M150 780 H420"/>
  <text class="label" x="285" y="770">Browser submits the token to the application</text>

  <text class="step" x="30" y="845">9</text>
  <path class="response" d="M420 840 H150"/>
  <text class="label" x="285" y="830">Application validates token and creates a session</text>

  <rect class="note" x="405" y="870" width="590" height="42"/>
  <text class="noteText" x="700" y="897">Internal users normally reach AD FS directly and do not pass through WAP.</text>
</svg>
