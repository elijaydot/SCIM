<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Conditional Access authentication-strength evaluation</title>
  <desc id="desc">A numbered flow shows initial authentication, Conditional Access evaluation, an authentication-strength requirement, checks for an enabled and registered method, and either successful application access or denial.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#123B5D"/>
    </marker>
    <style>
      .box { fill: #F7FAFC; stroke: #123B5D; stroke-width: 3; rx: 14; }
      .auth { fill: #E2F1FB; stroke: #075985; stroke-width: 3; rx: 14; }
      .check { fill: #FFF4CC; stroke: #7A4E00; stroke-width: 3; rx: 14; }
      .allow { fill: #E4F7E8; stroke: #176B2C; stroke-width: 3; rx: 14; }
      .deny { fill: #FDE8E8; stroke: #9B1C1C; stroke-width: 3; rx: 14; }
      .line { stroke: #123B5D; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .title { font: 700 28px Arial, sans-serif; fill: #102A43; }
      .label { font: 700 19px Arial, sans-serif; fill: #102A43; }
      .text { font: 16px Arial, sans-serif; fill: #243B53; }
      .small { font: 14px Arial, sans-serif; fill: #243B53; }
      .step { fill: #123B5D; }
      .stepText { font: 700 17px Arial, sans-serif; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <text x="600" y="42" text-anchor="middle" class="title">How an Authentication Strength Is Evaluated</text>

  <rect x="55" y="90" width="230" height="110" class="box"/>
  <circle cx="80" cy="115" r="18" class="step"/><text x="80" y="115" class="stepText">1</text>
  <text x="170" y="130" text-anchor="middle" class="label">Access application</text>
  <text x="170" y="160" text-anchor="middle" class="text">Browser or active client</text>

  <rect x="360" y="90" width="260" height="110" class="auth"/>
  <circle cx="385" cy="115" r="18" class="step"/><text x="385" y="115" class="stepText">2</text>
  <text x="490" y="130" text-anchor="middle" class="label">Initial authentication</text>
  <text x="490" y="160" text-anchor="middle" class="text">Entra ID or federated IdP</text>

  <rect x="695" y="90" width="430" height="110" class="check"/>
  <circle cx="720" cy="115" r="18" class="step"/><text x="720" y="115" class="stepText">3</text>
  <text x="910" y="128" text-anchor="middle" class="label">Conditional Access evaluates</text>
  <text x="910" y="158" text-anchor="middle" class="text">Matched policy requires a strength</text>

  <path d="M285 145 H360" class="line"/>
  <path d="M620 145 H695" class="line"/>

  <rect x="330" y="285" width="540" height="150" class="check"/>
  <circle cx="355" cy="310" r="18" class="step"/><text x="355" y="310" class="stepText">4</text>
  <text x="600" y="325" text-anchor="middle" class="label">Does the completed authentication satisfy the strength?</text>
  <text x="600" y="365" text-anchor="middle" class="text">Method enabled by policy?</text>
  <text x="600" y="393" text-anchor="middle" class="text">Method registered where required?</text>
  <text x="600" y="421" text-anchor="middle" class="text">Allowed combination completed?</text>
  <path d="M910 200 V245 H600 V285" class="line"/>

  <rect x="70" y="535" width="300" height="105" class="auth"/>
  <circle cx="95" cy="560" r="18" class="step"/><text x="95" y="560" class="stepText">5</text>
  <text x="220" y="568" text-anchor="middle" class="label">Prompt if possible</text>
  <text x="220" y="598" text-anchor="middle" class="small">Complete an allowed additional method</text>

  <rect x="455" y="535" width="290" height="105" class="allow"/>
  <circle cx="480" cy="560" r="18" class="step"/><text x="480" y="560" class="stepText">6A</text>
  <text x="600" y="568" text-anchor="middle" class="label">Requirement satisfied</text>
  <text x="600" y="598" text-anchor="middle" class="text">Continue to application</text>

  <rect x="830" y="535" width="300" height="105" class="deny"/>
  <circle cx="855" cy="560" r="18" class="step"/><text x="855" y="560" class="stepText">6B</text>
  <text x="980" y="568" text-anchor="middle" class="label">Requirement not met</text>
  <text x="980" y="598" text-anchor="middle" class="text">Deny access</text>

  <path d="M500 435 V485 H220 V535" class="line"/>
  <path d="M600 435 V535" class="line"/>
  <path d="M700 435 V485 H980 V535" class="line"/>
  <path d="M370 587 H455" class="line"/>
  <path d="M220 640 V665 H980 V640" class="line"/>

  <text x="430" y="478" class="small">Needs another method</text>
  <text x="612" y="500" class="small">Yes</text>
  <text x="790" y="478" class="small">No usable method</text>
  <text x="412" y="577" text-anchor="middle" class="small">Completed</text>
  <text x="600" y="683" text-anchor="middle" class="small">Prompt cancelled, failed, or cannot be completed</text>
</svg>
