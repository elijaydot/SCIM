<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc">
  <title id="title">Security Defaults to Conditional Access migration</title>
  <desc id="desc">Verify licenses, create emergency accounts, build and test report-only policies, disable Security Defaults, enable Conditional Access, and monitor.</desc>
  <defs><style>.b{fill:#f8fafc;stroke:#4f46e5;stroke-width:2}.n{fill:#4f46e5}.nt{font:700 16px Arial,sans-serif;fill:white}.t{font:600 15px Arial,sans-serif;fill:#1e1b4b}.a{stroke:#64748b;stroke-width:2;fill:none}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs>
  <g transform="translate(20 70)"><rect class="b" rx="12" width="150" height="100"/><circle class="n" cx="20" cy="20" r="15"/><text class="nt" x="20" y="26" text-anchor="middle">1</text><text class="t" x="75" y="52" text-anchor="middle">Verify licenses</text></g>
  <path class="a" marker-end="url(#m)" d="M170 120H190"/>
  <g transform="translate(190 70)"><rect class="b" rx="12" width="150" height="100"/><circle class="n" cx="20" cy="20" r="15"/><text class="nt" x="20" y="26" text-anchor="middle">2</text><text class="t" x="75" y="48" text-anchor="middle">Create emergency</text><text class="t" x="75" y="70" text-anchor="middle">accounts</text></g>
  <path class="a" marker-end="url(#m)" d="M340 120H360"/>
  <g transform="translate(360 70)"><rect class="b" rx="12" width="150" height="100"/><circle class="n" cx="20" cy="20" r="15"/><text class="nt" x="20" y="26" text-anchor="middle">3</text><text class="t" x="75" y="48" text-anchor="middle">Build policies</text><text class="t" x="75" y="70" text-anchor="middle">Report-only</text></g>
  <path class="a" marker-end="url(#m)" d="M510 120H530"/>
  <g transform="translate(530 70)"><rect class="b" rx="12" width="150" height="100"/><circle class="n" cx="20" cy="20" r="15"/><text class="nt" x="20" y="26" text-anchor="middle">4</text><text class="t" x="75" y="48" text-anchor="middle">Review impact</text><text class="t" x="75" y="70" text-anchor="middle">and sign-in logs</text></g>
  <path class="a" marker-end="url(#m)" d="M680 120H700"/>
  <g transform="translate(700 70)"><rect class="b" rx="12" width="170" height="100"/><circle class="n" cx="20" cy="20" r="15"/><text class="nt" x="20" y="26" text-anchor="middle">5</text><text class="t" x="85" y="48" text-anchor="middle">Disable</text><text class="t" x="85" y="70" text-anchor="middle">Security Defaults</text></g>
  <path class="a" marker-end="url(#m)" d="M870 120H890"/>
  <g transform="translate(890 70)"><rect class="b" rx="12" width="210" height="100"/><circle class="n" cx="20" cy="20" r="15"/><text class="nt" x="20" y="26" text-anchor="middle">6</text><text class="t" x="105" y="48" text-anchor="middle">Enable Conditional Access</text><text class="t" x="105" y="70" text-anchor="middle">and monitor</text></g>
</svg>
